<mat-card class="dashboard-card">
    <mat-toolbar color="primary" class="mb-3">
        <span>Employee Dashboard</span>
        <span class="spacer"></span>
        <button mat-raised-button color="accent" routerLink="/add">
      <mat-icon>person_add</mat-icon>
      Add Employee
    </button>
    </mat-toolbar>

    <table mat-table [dataSource]="resources" class="mat-elevation-z8 full-width-table">

        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">{{element.name}}</td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let element">{{element.email}}</td>
        </ng-container>

        <!-- Department Column -->
        <ng-container matColumnDef="department">
            <th mat-header-cell *matHeaderCellDef>Department</th>
            <td mat-cell *matCellDef="let element">{{element.department}}</td>
        </ng-container>

        <!-- Joining Date Column -->
        <ng-container matColumnDef="joiningDate">
            <th mat-header-cell *matHeaderCellDef>Joining Date</th>
            <td mat-cell *matCellDef="let element">{{element.joiningDate | date:'yyyy-MM-dd'}}</td>
        </ng-container>

        <!-- Mobile Number Column -->
        <ng-container matColumnDef="mobileNumber">
            <th mat-header-cell *matHeaderCellDef>Mobile Number</th>
            <td mat-cell *matCellDef="let element">{{element.mobileNumber}}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button color="primary" (click)="goToEdit(element)">
          <mat-icon>edit</mat-icon>
        </button>
                <button mat-icon-button color="warn" (click)="deleteResource(element.id)">
          <mat-icon>delete</mat-icon>
        </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</mat-card>
