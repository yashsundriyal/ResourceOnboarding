<div class="add-card">
    <h2>Add Employee</h2>

    <form #resourceForm="ngForm" (ngSubmit)="addResource()" class="form-container">

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Name</mat-label>
            <input matInput [(ngModel)]="resource.Name" name="name" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput [(ngModel)]="resource.Email" name="email" required type="email">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Department</mat-label>
            <input matInput [(ngModel)]="resource.Department" name="department" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Joining Date</mat-label>
            <input matInput [(ngModel)]="resource.JoiningDate" name="joiningDate" required type="date">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Mobile Number</mat-label>
            <input matInput [(ngModel)]="resource.MobileNumber" name="mobileNumber" required>
        </mat-form-field>

        <div class="button-group">
            <button mat-raised-button color="primary" type="submit">Submit</button>
            <button mat-stroked-button color="warn" (click)="dialogRef.close()">Cancel</button>
        </div>

    </form>
</div>
